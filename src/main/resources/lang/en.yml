settings:
  spruce-ground:
    label: "Spruce forest floor"
    description: "Podzol and coarse dirt around large planted and newly generated spruces."
  spruce-snow:
    label: "Snow around spruces"
    description: "Place a snow layer on empty ground without replacing existing snow or plants."
  spruce-snow-cold-only:
    label: "Spruce snow only in cold locations"
    description: "Disable to allow decorative snow around spruces in warm biomes too."
  applied: "<green>CustomTrees settings applied."
  rejected: "<red>Invalid combination: {error} – the previous values were restored."
  section-description: "Tree growth, world generation, catalyst costs, fire markers and garden regrowth. World selection (enabled-worlds) only in config.yml."
  custom-player-grown-trees:
    label: "Custom trees from saplings"
    description: "Replaces the growth of 1×1 and 2×2 saplings with custom tree shapes"
  connected-shrubs-and-hedges:
    label: "Shrubs and hedges"
    description: "2–3 connected saplings become shrubs, 4 or more a hedge"
  replace-generated-trees:
    label: "Replace generated trees"
    description: "Replaces trees from world generation (new chunks only)"
  replacement-chance:
    label: "Replacement chance"
    description: "Share of generated trees that are replaced (0 = none, 1 = all)"
  generated-tree-scan-depth:
    label: "Scan depth"
    description: "How many blocks below the surface generated trees are searched for"
  new-chunk-post-processing:
    label: "New-chunk post-processing"
    description: "One-time pass over newly generated chunks that replaces their trees (also catches late Iris objects)"
  new-chunk-post-process-delay-ticks:
    label: "Post-processing delay"
    description: "Ticks until a new chunk is post-processed"
  giant-3x3-saplings:
    label: "Giant trees from 3×3"
    description: "3×3 saplings create extra-large trees"
  natural-3x3-growth:
    label: "3×3 natural growth"
    description: "Giant trees also grow from normal growth ticks"
  bonemeal-3x3-growth:
    label: "3×3 with bone meal"
    description: "Bone meal triggers giant trees immediately"
  giant-min-height:
    label: "Giant: min. height"
    description: "Must be ≤ max. height"
  giant-max-height:
    label: "Giant: max. height"
    description: "Must be ≥ min. height"
  giant-canopy-radius:
    label: "Giant: crown radius"
    description: "Radius of the crown in blocks"
  colossal-5x5-saplings:
    label: "Colossi from 5×5"
    description: "5×5 saplings create colossal trees"
  natural-5x5-growth:
    label: "5×5 natural growth"
    description: "Colossi also grow from normal growth ticks"
  bonemeal-5x5-growth:
    label: "5×5 with bone meal"
    description: "Bone meal triggers colossi immediately"
  colossal-min-height:
    label: "Colossus: min. height"
    description: "Must be ≤ max. height"
  colossal-max-height:
    label: "Colossus: max. height"
    description: "Must be ≥ min. height"
  colossal-canopy-radius:
    label: "Colossus: crown radius"
    description: "Radius of the crown in blocks"
  glowstone-growth:
    label: "Luminous trees (glowstone dust)"
    description: "Right-clicking with glowstone dust grows a protected luminous tree"
  glowstone-xp-cost:
    label: "Luminous tree: XP cost"
    description: "XP points per luminous tree in survival mode"
  glowstone-leaves-per-block:
    label: "Luminous tree: leaves per glowstone"
    description: "One glowstone per this many leaf blocks"
  glowstone-max-blocks:
    label: "Luminous tree: max. glowstone"
    description: "Maximum number of glowstone blocks per tree"
  glowstone-dark-light-level:
    label: "Luminous tree: dark light level"
    description: "Leaves up to this light level count as dark"
  glowstone-growth-cooldown-seconds:
    label: "Glowstone growth cooldown (seconds)"
    description: "Minimum time between successful glowstone trees per player; 0 disables it"
  glowstone-growth-daily-limit:
    label: "Glowstone trees per UTC day"
    description: "Maximum successful glowstone trees per player per UTC day; 0 disables it"
  coal-growth:
    label: "Coal trees"
    description: "Right-clicking with coal grows an unprotected tree"
  coal-growth-cooldown-seconds:
    label: "Coal growth cooldown (seconds)"
    description: "Minimum time between successful coal trees per player; 0 disables it"
  coal-growth-daily-limit:
    label: "Coal trees per UTC day"
    description: "Maximum successful coal trees per player per UTC day; 0 disables it"
  coal-costs:
    normal:
      label: "Coal cost: normal"
      description: "Coal required for a single sapling or shrub growth (1–64)"
    medium:
      label: "Coal cost: medium"
      description: "Coal required for a 2×2 tree (1–64)"
    giant:
      label: "Coal cost: giant"
      description: "Coal required for a 3×3 tree (1–64)"
    colossal:
      label: "Coal cost: colossal"
      description: "Coal required for a 5×5 tree (1–64)"
    hedge:
      label: "Coal cost: hedge"
      description: "Coal required for a connected hedge (1–64)"
