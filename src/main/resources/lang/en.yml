# /customtrees through Vystorm Core: description, help and tab completion per player. "aliases" under
# commands.customtrees are extra root commands (server-wide, the admin chooses the languages: Core config
# commands.localized-aliases); "name" and "aliases" of a subcommand are accepted in every language, English always works.
commands:
  customtrees:
    description: "Custom trees: tree guide, tagged saplings, pruning, planting helper and herbarium"
    aliases: []
    sub:
      breed:
        name: "breed"
        aliases: []
        description: "Cross the two growth-profile saplings held in your hands"
      guide:
        name: guide
        aliases: []
        description: "Open the tree guide (web page or in-game tutorial); also /customtrees web"
        args:
          page: "guide|species|admin"
      sapling:
        name: sapling
        aliases: []
        description: "Turn the single sapling in your hand into a sapling with crown form and size"
        usage: "FORM SIZE"
        args:
          form: FORM
          size: SIZE
      prune:
        name: prune
        aliases: []
        description: "Prune the crown of your garden tree you are looking at"
      plant:
        name: plant
        aliases: []
        description: "Planting helper: squares and hedge rows (menu, size, hedgeN or off)"
        args:
          size: "2x2|3x3|5x5|10x10|hedge4..hedge32|off"
      herbarium:
        name: herbarium
        aliases: []
        description: "Your herbarium, another player's herbarium or the top list"
        args:
          player: "PLAYER|top"
      next:
        name: next
        aliases: []
        description: "Suggest a missing herbarium form with planting instructions"
        args:
          plant: PLANT
      status:
        name: status
        aliases: []
        description: "Show the active settings and feature status"
      reload:
        name: reload
        aliases: []
        description: "Reload the configuration and language files"
    values:
      status: status
      guide: guide
      species: species
      admin: admin
      top: top

