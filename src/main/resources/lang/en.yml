    label: "Protect custom trunks from fire"
    description: "Protects exact tracked trunk blocks from direct burn events; it does not contain wildfires"
  fire-protect-crowns:
    label: "Protect custom crowns from fire"
    description: "Protects exact tracked leaf blocks from direct burn events; it does not contain wildfires"
  garden-regrowth-seconds:
    label: "Garden leaf regrowth (seconds)"
    description: "Delay before successfully pruned registered leaves regrow (10–86400 seconds)"
  garden-max-trees:
    label: "Garden trees (whole server)"
    description: "How many profile trees the server keeps for pruning; new trees beyond it are not registered (16–1024)"

# Web page "trees" (optional, Vystorm Core 0.24.0+). web.ui.* are the texts of the page in the Vystorm web UI.
web:
  module:
    title: "Tree guide"
    description: "How saplings grow into custom trees: formations, species, catalysts and costs"
  error:
    reload-failed: "Reload failed; the previous settings remain active: {error}"
    no-permission: "You do not have permission for this."
    not-ready: "CustomTrees is not ready yet."
  ui:
    tab:
      guide: "How to grow"
      species: "Species"
      admin: "Admin"
    loading: "Loading the tree guide…"
    error: "The tree guide could not be loaded: {error}"
    intro: "Plant saplings of the same kind at one height. The shape of the group decides which tree grows – the biggest complete formation wins."
    worlds:
      all: "Works in all normal (overworld) worlds."
      some: "Works in these worlds: {worlds}"
    permission: "Growing needs the permission {permission} (players have it by default)."
    priority: "Order of checks: 5×5 → 3×3 → 2×2 → hedge/shrubs → single sapling."
    formations: "Sapling formations"
    formation:
      single:
        title: "Single sapling"
        text: "Grows into a custom tree of its species in one of four architecture variants."
      square:
        title: "2×2 square"
        text: "Four equal saplings as a square grow a medium-large tree with a thick trunk."
      shrub:
        title: "Shrubs"
        text: "{min}–{max} connected saplings (also diagonally) become a group of shrubs."
      hedge:
        title: "Hedge"
        text: "{min} or more connected saplings – straight, diagonal, around corners or branching, up to {max} – become a continuous hedge."
      giant:
        title: "Giant tree (3×3)"
        text: "Nine equal saplings as a gap-free square grow an extra-large tree with a 3×3 trunk."
      colossal:
        title: "Colossus (5×5)"
        text: "25 equal saplings as a gap-free square grow a colossal tree with a round trunk and a wide crown."
    size:
      height: "{min}–{max} blocks high"
      radius: "crown radius {radius}"
    disabled: "Disabled on this server"
    legend:
      sapling: "Sapling"
      target: "Right-click or bone meal here (any sapling of the formation works)"
    diagram: "Top view of the formation: {count} saplings"
    trigger:
      natural: "Natural growth"
      bonemeal: "Bone meal"
      glowstone: "Glowstone dust"
      coal: "Coal"
      "off": "{trigger}: off"
    protected: "Protected trunk"
    fellable: "Fellable"
    catalysts: "Catalysts and costs"
    catalyst:
      bonemeal:
        title: "Bone meal"
        text: "Right-click a sapling of the formation: it grows at once."
        cost: "Uses 1 bone meal"
      glowstone:
        title: "Luminous tree"
        text: "Right-click with glowstone dust: a protected tree with glowstone in its dark inner foliage grows at once."
        cost: "Uses 1 glowstone dust + {xp} XP points"
        light: "One glowstone per {leaves} leaves, at most {max} per tree; leaves at light level {light} or darker count as dark."
        nodrop: "This glowstone is decoration: mining or explosions drop nothing and pistons cannot move it."
      coal:
        title: "Coal tree"
        text: "Right-click with coal: the same custom tree grows at once, deliberately without trunk protection, so tree-felling plugins may cut it."
        cost: "Uses 1 coal"
      creative: "In creative mode catalysts and XP are free."
      refund: "If the tree cannot grow (no room, protected area), catalyst and XP are refunded."
    tips: "Good to know"
    room: "Keep the space above the whole formation free. Trees only replace air, grass, ferns, vines, natural leaves and their own saplings – never other blocks."
    protection: "With CoreProtect the trunks of 3×3, 5×5 and luminous trees are recorded as placed blocks, so SmoothTimber does not fell them. 1×1, 2×2, shrubs, hedges and coal trees stay fellable."
    generation:
      "on": "World generation: in new chunks {chance} of the generated trees are replaced by the same custom shapes."
      "off": "World generation: generated trees are not replaced on this server."
    compare:
      title: "Size comparison"
