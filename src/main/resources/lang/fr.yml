garden:
  unavailable: Cette action de jardin n'est pas disponible; vérifier les autorisations, la version Core ou la santé de stockage.
  no-tree: Regardez les feuilles de votre arbre de profil planté dans six blocs.
  denied: Aucune feuille de couronne correspondante ne peut être taillée avec vos permissions de construction actuelles.
  pruned: Feuilles de couronne taillées {count}. La repousse ne commence pas plus tôt que {seconds} secondes, pendant que
    vous êtes en ligne et que l'espace reste vide.
  sapling-usage: /customtrees sapling <random|open_grown|forest|windswept|ancient> <normal|medium|giant|colossal>. Nécessite
    un noyau 0.26.5 et customtrees.grow.
  single-sapling: Tenez exactement un arbre non modifié dans votre main principale.
  sapling-ready: Profil de croissance sauvé. Plantez l'arbre dans le modèle de taille correspondant; les coûts normaux et
    les règles de protection s'appliquent toujours.
  pattern-mismatch: Le profil sauvegardé nécessite son modèle de taille correspondant. Tagged jeunes arbres en un seul motif
    doit partager le profil et le propriétaire.
world-tree:
  invalid-setting: Les arbres du monde entier {setting} doivent être entiers de {min} à {max}.
  preview: '{size}x{size} formation: hauteur {height}, rayon de la couronne {radius}. Faites un clic droit avec le repas osseux.
    Les obstacles sont cultivés autour; les bâtiments sont conservés.'
  bonemeal: Utilisez la farine osseuse pour cette formation. Les plants de charbon, de pierre brillante et de profilés marqués
    ne sont pas supportés pour cette taille.
  busy: Un emploi en croissance est déjà en préparation ou en croissance. Attendez.
  planning: Préparer votre arbre mondial (charger la zone, planifier, vérifier l'espace). Aucun repas osseux n'est consommé
    jusqu'à ce que la croissance soit approuvée.
  no-room: La croissance des arbres du monde s'est arrêtée avant le placement. Vérifiez les plantes, le sol, les zones protégées,
    votre autorisation et votre repas osseux.
  shrunk: 'Pas assez de hauteur de construction: cet arbre ne pousse que {height} blocs de hauteur (rayon de la couronne {radius}).'
  too-high: Il n'y a pas assez de hauteur de construction pour un arbre du monde. Plantez la formation plus bas.
  too-large: Cette formation a besoin de trop de morceaux. Réduire la hauteur ou le rayon dans la configuration.
  load-failed: La zone autour de l'arbre du monde ne pouvait pas être chargée. Rien n'a été consommé; veuillez réessayer rapidement.
  growing: La culture de votre arbre mondial par étapes ({blocks} blocs).
  complete: Votre arbre du monde a fini de grandir.
  partial: La croissance des arbres du monde s'est terminée par des blocs laissés de côté ou inachevés. Les bâtiments existants
    ont été conservés.
world-trees:
  enabled:
