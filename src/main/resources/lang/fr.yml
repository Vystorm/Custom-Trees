shaking:
  resting: <gray>Cet arbre a été secoué il y a un moment. Réessayez en {minutes} min.
  no-crown: <gray>Ce coffre n'a pas de couronne à secouer.
  nothing: <gray>Seules quelques feuilles tombent.
  enabled:
    label: Agiter les arbres
    description: Faites un clic droit sur un tronc avec une main vide pour secouer les fruits, les bâtons et les jeunes arbres
      hors de la couronne.
  cooldown-seconds:
    label: Temps de repos (secondes)
    description: Combien de temps un arbre secoué se repose avant qu'il puisse être secoué à nouveau. 0 = pas de repos.
  max-rolls:
    label: Max. gouttes par secousse
    description: Limite supérieure des rouleaux de butin; une couronne obtient un rouleau par 40 feuilles.
  min-leaves:
    label: Min. laisse
    description: Un tronc a besoin au moins de ces nombreuses feuilles de son espèce autour d'elle pour être secoué.
  golden-apples:
    label: Pommes d'or
    description: Les couronnes de chêne et de chêne foncé peuvent très rarement faire tomber une pomme dorée. Éteins-les pour
      les garder hors de l'économie.
