planting-helper:
  max-hedge-length:
    label: Longueur maximale de la couverture
    description: Longueur maximale de la rangée, 4 à 32. Les valeurs inférieures à 4 désactivent la plantation de haies.
  enabled:
    label: Aide à la plantation
    description: Les joueurs choisissent une taille carrée et plantent le carré entier avec un arbre (/customtrees plant,
      /vmenu).
  max-size:
    label: Plus grand carré
    description: 'Plus grand carré l''aide offre: 2, 3, 5 ou 10.'
  keep-active:
    label: Rester actif
    description: Gardez l'aide allumée après qu'un carré ait été planté.
  timeout-seconds:
    label: Temps d'arrêt (secondes)
    description: Un assistant non utilisé s'éteint après cette période.
timber:
  progress: <gray>Coffre <white>{chopped}/{required}</white> haché
  busy: <gray>Trop d'arbres tombent en ce moment; ce bois s'est cassé tout seul.
  too-large: <gray>Cet arbre est trop grand ou atteint des terres déchargées; seul le bois s'est brisé.
  protected: <red>Une partie de cet arbre est protégée; il reste debout.
  tool-spared: <gold>Votre hache se briserait; seulement cette bûche a été hachée.
  player:
    title: Bois
    description: Fell arbres entiers avec une hache
    locked: Le serveur décide pour tout le monde.
    mode-server: Par défaut du serveur
    mode-drop: Tout droit
    mode-fall: Chute des arbres
    use:
      label: Bois
      description: Le bûcheron avec une hache tombe tout l'arbre.
    mode:
      label: Comment les arbres descendent
      description: 'Tout droit : l''arbre se brise du bas vers le haut. L''arbre tombe : il s''éloigne de vous et se transforme
        en objets.'
  choice:
    fall: Chute des arbres
    drop: Tout droit
    first-log: Premier journal
    percent: Pourcentage du tronc
    standing: Seulement debout
    sneaking: Seulement en se faufilant
    any: Toujours
    server-mode: Mode serveur
    disabled: Jamais
    vanilla: Comme la vanille
    none: Rien
    pause: Pause le bois intégré
    run-both: Exécutez les deux
  enabled:
    label: Bois
    description: Le bûcheron d'un arbre avec une hache tombe sur tout l'arbre. Les constructions de joueurs ne sont jamais
      abattues.
  mode:
    label: Comment les arbres descendent
    description: chute = l'arbre s'éloigne du joueur autour de sa souche et se transforme en objets; chute = il se décompose
      tout droit du bas vers le haut.
  trigger:
    label: Quand l'arbre tombe
    description: premier log = au premier log haché; pourcentage = une fois que la part de la coupe transversale du tronc
      est coupée.
  trunk-percent:
    label: Part du tronc à couper (%)
    description: 'Pourcentage de déclenchement : part de la section transversale du tronc qui doit être hachée avant la chute
      de l''arbre.'
  sneaking:
    label: Revêtements
    description: En position debout = bois seulement sans s'enfiler (s'enfiler pour couper des billes simples); en s'enfilant
      = seulement pendant s'enfiler; n'importe lequel = toujours.
  require-axe:
    label: Axe requis
    description: Le bois ne fonctionne qu'avec une hache dans la main principale.
  worlds:
    label: Mondes
    description: Mondes où le bois fonctionne; vide = chaque monde.
  player-choice:
    label: Les joueurs choisissent
    description: Les joueurs peuvent éteindre le bois pour eux-mêmes et cueillir la chute d'arbre ou tout droit en /vsettings.
  tree-types:
    small:
      label: Petits arbres
      description: 'Single et 2x2 arbres, arbustes et haies: mode serveur, chute, chute ou désactivé.'
    giant:
      label: 3x3 géants
      description: 'Arbres géants de 3x3 jeunes arbres : mode serveur, chute, chute ou désactivé.'
    colossal:
      label: 5x5 colosses
      description: 'Arbres colossaux de 5x5 jeunes arbres: mode serveur, chute, chute ou désactivé.'
    world:
      label: Arbres du monde
      description: '10x10 arbres du monde et autres arbres énormes: mode serveur, chute, chute ou désactivé.'
  tool:
    durability-per-log:
      label: Porter par log
      description: Des points de durabilité la hache perd par log abattu (Unbreaking s'applique).
    spare-tool:
      label: Épargnez la hache
      description: Ne tombez pas un arbre quand la hache se briserait; alors seulement le bois haché se brise.
  drops:
    leaves:
      label: Feuilles gouttes
      description: vanille = les feuilles déposent des jeunes arbres, des bâtonnets et des pommes comme la vanille (Fortune
        aide, Silk Touch garde les feuilles); aucune = rien.
    into-inventory:
      label: Dans l'inventaire
      description: Les objets feuillés entrent directement dans l'inventaire; ce qui ne convient pas aux terres sur le terrain.
  replant:
    label: Replantation
    description: Après la chute d'un petit arbre, on plante un arbre approprié où se trouvait son tronc (quatre pour 2x2)
      – à partir des gouttes de l'arbre, autre part de l'inventaire.
  detection:
    max-blocks:
      label: Blocs max. par arbre
      description: Les arbres avec plus de grumes et de feuilles ne sont pas abattus.
    max-radius:
      label: Rayon max
      description: Jusqu'où un arbre peut atteindre latéralement du tronc haché.
    max-height:
      label: Hauteur maximale
      description: Jusqu'à quel point un arbre peut atteindre au-dessus de la coupe.
    min-leaves:
      label: Min. laisse
      description: Un arbre a besoin au moins de ces nombreuses feuilles naturelles (ou des bouchons pour champignons et champignons).
    natural-ground:
      label: Terrain naturel
      description: Le tronc doit se tenir sur un sol naturel tel que la saleté, l'herbe, le sable, la pierre ou le nylium.
    coreprotect-check:
      label: Contrôle CoreProtect
      description: 'Avec CoreProtect: jamais tombé enregistre un joueur placé.'
    only-generated-trees:
      label: Seulement des arbres générés
      description: Seulement les arbres tombés CustomTrees ont grandi ou généré (ou, avec CoreProtect, les arbres pas de joueur
        placé).
  fall:
    max-displays:
      label: Affichages max. par arbre
      description: Les entités d'affichage d'un arbre tombant; les arbres plus grands sont affichés avec des cubes fusionnés.
    fall-ticks:
      label: Durée de l'automne
      description: Durée d'une chute complète des tiques (20 = 1 seconde).
  performance:
    blocks-per-tick:
      label: Blocs par tique
      description: Blocs enlevés par tique, partagés par tous les arbres qui tombent.
    checks-per-tick:
      label: Contrôles par tique
      description: Contrôles de protection (événements de rupture) par tique, partagés par tous les arbres qui tombent.
    falls-per-world:
      label: Chutes par monde
      description: Des arbres tombent en même temps dans un monde.
    falls-per-player:
      label: Chutes par joueur
      description: Arbres un joueur peut avoir tomber en même temps.
  other-timber-plugins:
    label: Autres greffons en bois
    description: pause = éteindre le bois intégré pendant que SmoothTimber ou un autre plugin bois est installé; run-oth =
      garder les deux.
  percent-memory-seconds:
    label: Mémoire des coupures (secondes)
    description: 'Déclencheur en pourcentage : combien de temps un tronc à moitié coupé se souvient de ses coupures.'
  protected-region-kinds:
    label: Types de régions protégées
    description: Vystorm Natures de la région centrale où le bois n'enlève rien; une région drapeau bois l'emporte.
