validation:
  replacement-chance: La chance de remplacement doit être comprise entre {min} et {max}.
  giant-heights: Les hauteurs géantes doivent satisfaire {min} <= min <= max <= {max}.
  giant-canopy-radius: Le rayonnement de la canopie géante doit être compris entre {min} et {max}.
  colossal-heights: Les hauteurs colossales doivent satisfaire à {min} <= min <= max <= {max}.
  colossal-canopy-radius: Le rayonnement colossal doit être compris entre {min} et {max}.
  glowstone-xp-cost: Le coût de la pierre-xp doit être compris entre {min} et {max}.
  generated-tree-scan-depth: la profondeur des arbres doit être comprise entre {min} et {max}.
  glowstone-leaves-per-block: Les feuilles de pierre brillante par bloc doivent être comprises entre {min} et {max}.
  glowstone-max-blocks: Les blocs lumineux-max doivent être compris entre {min} et {max}.
  glowstone-dark-light-level: Le niveau de lumière rouge-brillant doit être compris entre {min} et {max}.
  new-chunk-post-process-delay-ticks: les nouveaux ticks après traitement doivent être compris entre {min} et {max}.
  catalyst-cooldown: '{catalyst}-temps de récupération de la croissance-secondes doivent être compris entre {min} et {max}.'
  catalyst-daily-limit: La limite journalière de croissance de {catalyst} doit être comprise entre {min} et {max}.
  coal-costs-section: settings.coal-costs doit être une section YAML.
  coal-growth-cost: les coûts du charbon.{growthClass} doivent être un nombre entier de {min} à {max}.
  biome-profiles-root: les profils biologiques doivent être une section YAML.
  biome-profiles-limit: Au plus {max} groupes de profils de biome sont autorisés.
  biome-profiles-biome-limit: Au plus {max} affectations de biome sont autorisées.
  biome-profile-id: 'Profil de biome non valide id: {id}.'
  biome-profile-group: Profil de biome {id} doit être une section YAML.
  biome-profile-biomes: Profil du biome {id} doit énumérer au moins un biome.
  biome-profile-number: Profil de biome {id} a une valeur numérique invalide pour {field}.
  biome-profile-scale: 'Profil de biome {id}: {field} doit être compris entre {min} et {max}.'
  biome-profile-form: 'Profil de biome {id} a une forme de couronne inconnue: {form}.'
  biome-profile-chance: 'Profil de biome {id} : la chance de remplacement doit être comprise entre {min} et {max}.'
  biome-profile-biome-key: 'Profil de biome {id} a une clé de biome invalide: {biome}.'
  biome-profile-unknown-biome: 'Profil de biome {id} référence un biome inconnu: {biome}.'
  biome-profile-duplicate-biome: Le biome {biome} est attribué à plus d'un profil.
  biome-profiles-core: Les profils biomé non vides nécessitent Vystorm Core 0.26.5 ou plus récent avec TREE_GROWTH_PROFILES.
settings:
  spruce-ground:
    label: Sol forestier de l'épinette
    description: Podzol et la saleté grossière autour de grandes épinettes plantées et nouvellement produites.
  spruce-snow:
    label: Neige autour des épinettes
    description: Placer une couche de neige sur un sol vide sans remplacer la neige ou les plantes existantes.
  spruce-snow-cold-only:
    label: Neige d'épinette seulement dans les endroits froids
    description: Désactiver aussi la neige décorative autour des épicéas dans des biomes chauds.
  applied: <green>CustomTrees réglages appliqués.
  rejected: '<red>Combinaison non valide : {error} – les valeurs précédentes ont été restaurées.'
  section-description: Croissance des arbres, génération mondiale, coûts des catalyseurs, marqueurs de feu et repousse des
    jardins. La sélection mondiale (mondes compatibles) n'a lieu qu'en config.yml.
  custom-player-grown-trees:
    label: Arbres personnalisés des jeunes arbres
    description: Remplace la croissance de 1×1 et 2×2 jeunes arbres avec des formes d'arbres personnalisées
  connected-shrubs-and-hedges:
    label: Arbustes et haies
    description: 2–3 Les jeunes arbres reliés deviennent des arbustes, 4 ou plus une haie
  replace-generated-trees:
    label: Remplacer les arbres générés
    description: Remplace les arbres de génération mondiale (nouveaux morceaux seulement)
  replacement-chance:
    label: Possibilité de remplacement
    description: Part des arbres produits qui sont remplacés (0 = aucun, 1 = tout)
  generated-tree-scan-depth:
    label: Profondeur du balayage
    description: Combien de blocs sous les arbres générés par la surface sont recherchés
  new-chunk-post-processing:
    label: Post-traitement des nouveaux morceaux
    description: Passage ponctuel sur des morceaux nouvellement générés qui remplacent leurs arbres (attrape également des
      objets d'iris tardif)
  new-chunk-post-process-delay-ticks:
    label: Délai de traitement
    description: Clique jusqu'à ce qu'un nouveau morceau soit post-traité
  giant-3x3-saplings:
    label: Arbres géants de 3×3
    description: 3×3 jeunes arbres créent des arbres extra-larges
  natural-3x3-growth:
    label: 3×3 croissance naturelle
    description: Les arbres géants poussent également à partir de tiques de croissance normales
  bonemeal-3x3-growth:
    label: 3×3 avec farine d'os
    description: Le repas des os déclenche immédiatement des arbres géants
  giant-min-height:
    label: 'Géant: hauteur min'
    description: Doit être ≤ hauteur maximale
  giant-max-height:
    label: 'Géant: hauteur max'
    description: Doit être ≥ min
  giant-canopy-radius:
    label: 'Géant: rayon de la couronne'
    description: Rayon de la couronne en blocs
  colossal-5x5-saplings:
    label: Colossi à partir de 5×5
    description: 5×5 jeunes arbres créent des arbres colossaux
  natural-5x5-growth:
    label: 5×5 croissance naturelle
    description: Colossi pousse également à partir de tiques de croissance normales
  bonemeal-5x5-growth:
    label: 5×5 avec farine d'os
    description: Le repas osseux déclenche des colossi immédiatement
  colossal-min-height:
    label: 'Colossus: hauteur min'
    description: Doit être ≤ hauteur maximale
  colossal-max-height:
    label: 'Colossus: hauteur max'
    description: Doit être ≥ min
  colossal-canopy-radius:
    label: 'Colossus: rayon de la couronne'
    description: Rayon de la couronne en blocs
  glowstone-growth:
    label: Arbres lumineux (poussières de pierre)
    description: Le clic droit avec la poussière de pierre brillante pousse un arbre lumineux protégé
  glowstone-xp-cost:
    label: 'Arbre lumineux: XP coût'
    description: XP points par arbre lumineux en mode survie
  glowstone-leaves-per-block:
    label: 'Arbre lumineux: feuilles par pierre brillante'
    description: Une pierre brillante par ces nombreux blocs de feuilles
  glowstone-max-blocks:
    label: 'Arbre lumineux: max'
    description: Nombre maximal de blocs de pierres brillantes par arbre
  glowstone-dark-light-level:
    label: 'Arbre lumineux: niveau lumineux foncé'
    description: Les feuilles jusqu'à ce niveau de lumière comptent comme sombre
  glowstone-growth-cooldown-seconds:
    label: Temps de récupération de la croissance de Glowstone (secondes)
    description: Temps minimum entre les arbres brillants réussis par joueur; 0 la désactive
  glowstone-growth-daily-limit:
    label: Arbres glowstone par UTC jour
    description: Nombre maximal d'arbres en pierre brillante par joueur pour UTC jours; 0 la désactive
  coal-growth:
    label: Houilles
    description: Le clic droit avec le charbon pousse un arbre non protégé
  coal-growth-cooldown-seconds:
    label: Temps de récupération du charbon (secondes)
    description: Temps minimum entre les arbres de charbon réussis par joueur; 0 la désactive
  coal-growth-daily-limit:
    label: Arbres de charbon pour UTC jours
    description: Nombre maximal d'arbres de charbon par joueur pour UTC jours; 0 la désactive
  coal-costs:
    normal:
      label: 'Coût du charbon: normal'
      description: Charbon nécessaire pour une croissance arbustive (1–64)
    medium:
      label: 'Coût du charbon: moyen'
      description: Charbon nécessaire pour un 2×Arbre 2 (1–64)
    giant:
      label: 'Coût du charbon: géant'
      description: Charbon nécessaire pour un 3×Arbre 3 (1–64)
    colossal:
      label: 'Coût du charbon: colossal'
      description: Charbon nécessaire pour un 5×Arbre 5 (1–64)
    hedge:
      label: 'Coût du charbon: couverture'
      description: Charbon nécessaire pour une haie connectée (1–64)
  fire-protect-trunks:
    label: Protéger les coffres personnalisés du feu
    description: Protège les blocs de troncs suivis exacts contre les brûlures directes; il ne contient pas de feux de forêt
  fire-protect-crowns:
    label: Protéger les couronnes personnalisées du feu
    description: Protège exactement les blocs de feuilles suivis des brûlures directes; il ne contient pas de feux de forêt
  garden-regrowth-seconds:
    label: Recroissance des feuilles du jardin (secondes)
    description: Retard avant la taille réussie des feuilles enregistrées regrow (10–86400 secondes)
web:
  module:
    title: Guide des arbres
    description: 'Comment les jeunes arbres deviennent des arbres sur mesure : formations, espèces, catalyseurs et coûts'
  error:
    reload-failed: 'La recharge a échoué; les réglages précédents restent actifs: {error}'
    no-permission: Vous n'avez pas la permission pour ça.
    not-ready: CustomTrees n'est pas encore prêt.
  ui:
    tab:
      guide: Comment grandir
      species: Espèce
      admin: Administrateur
    loading: Chargement du guide de l'arbre...
    error: 'Le guide des arbres n''a pas pu être chargé: {error}'
    intro: Plantez des jeunes arbres du même genre à une hauteur. La forme du groupe décide quel arbre pousse – la plus grande
      formation complète gagne.
    worlds:
      all: Fonctionne dans tous les mondes normaux (urbains).
      some: 'Œuvres dans ces mondes: {worlds}'
    permission: La croissance a besoin de la permission {permission} (les joueurs l'ont par défaut).
    priority: 'Ordre des contrôles: 5×5 → 3×3 → 2×2 → haies/arbustes → Un seul arbre.'
    formations: Formations de saplage
    formation:
      single:
        title: Exploitation unique
        text: Grandit en un arbre personnalisé de son espèce dans l'une des quatre variantes d'architecture.
      square:
        title: 2×2 carré
        text: Quatre gaules égales comme un carré poussent un arbre moyen-grand avec un tronc épais.
      shrub:
        title: Abris
        text: '{min}–{max} les jeunes arbres reliés (également diagonalement) deviennent un groupe d''arbustes.'
      hedge:
        title: Couverture
        text: '{min} arbres ou plus reliés – droits, diagonaux, autour de coins ou ramifications, jusqu''à {max} – deviennent
          une haie continue.'
      giant:
        title: Arbre géant (3)×3)
        text: Neuf gaules égales comme un carré sans espace poussent un arbre extra-large avec un 3×3 coffre.
      colossal:
        title: Colosse (5)×5)
        text: 25 arbres égaux comme un carré sans espace poussent un arbre colossal avec un tronc rond et une large couronne.
    size:
      height: '{min}–{max} blocs élevés'
      radius: rayon de la couronne {radius}
    disabled: désactivé sur ce serveur
    legend:
      sapling: Saupoudrage
      target: Faites un clic droit ou un repas d'os ici (tout arbre de la formation fonctionne)
    diagram: 'Vue supérieure de la formation: {count} jeunes arbres'
    trigger:
      natural: Croissance naturelle
      bonemeal: Repas os
      glowstone: Poussière
      coal: Charbon
      'off': '{trigger}: hors taxes'
    protected: Coffre protégé
    fellable: Fellable
    catalysts: Catalyseurs et coûts
    catalyst:
      bonemeal:
        title: Repas os
        text: 'Faites un clic droit sur la formation : elle pousse à la fois.'
        cost: Utilisation 1 farine d'os
      glowstone:
        title: Arbre lumineux
        text: 'Faites un clic droit avec de la poussière de pierre rouge : un arbre protégé avec de la pierre rouge dans son
          feuillage intérieur foncé pousse à la fois.'
        cost: Utilisations 1 poussières de gemme + {xp} XP points
        light: Une pierre brillante par {leaves} feuilles, au plus {max} par arbre; feuilles au niveau clair {light} ou nombre
          plus foncé comme sombre.
        nodrop: 'Cette pierre brillante est la décoration : l''exploitation minière ou les explosions ne laissent rien tomber
          et les pistons ne peuvent pas la déplacer.'
      coal:
        title: Charbonnier
        text: 'Faites un clic droit avec le charbon: le même arbre personnalisé pousse à la fois, délibérément sans protection
          du tronc, de sorte que les plugins de felling d''arbres peuvent le couper.'
        cost: Utilisations 1 charbon
      creative: En mode créatif, les catalyseurs et XP sont gratuits.
      refund: Si l'arbre ne peut pas pousser (pas de place, zone protégée), le catalyseur et XP sont remboursés.
    tips: Bon à savoir
    room: Gardez l'espace au-dessus de toute la formation libre. Les arbres remplacent seulement l'air, l'herbe, les fougères,
      les vignes, les feuilles naturelles et leurs propres jeunes arbres – jamais d'autres blocs.
    protection: Avec CoreProtect les malles de 3×3, 5×5 et des arbres lumineux sont enregistrés comme des blocs placés, donc
      SmoothTimber ne les a pas abattus. 1×1, 2×2, les arbustes, les haies et les houillères restent chavirables.
    generation:
      'on': 'Génération mondiale: dans les nouveaux morceaux {chance} des arbres générés sont remplacés par les mêmes formes
        personnalisées.'
      'off': 'Génération mondiale : les arbres générés ne sont pas remplacés sur ce serveur.'
    compare:
      title: Comparaison de taille
      single: 1×1 arbre
      giant: 3×3 géant
      colossal: 5×5 colosses
      player: Joueur
      caption: Hauteurs maximales en blocs; un joueur mesure 2 blocs.
