        cost: Utilizza il carbone 1
      creative: In modalità creativa catalizzatori e XP sono liberi.
      refund: Se l'albero non può crescere (nessuna stanza, area protetta), catalizzatore e XP sono rimborsati.
    tips: Buono a sapersi
    room: Tenere lo spazio sopra l'intera formazione libero. Gli alberi sostituiscono solo aria, erba, felci, viti, foglie
