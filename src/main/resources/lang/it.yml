settings:
  spruce-ground:
    label: Pianta di foresta di abete
    description: Podzol e sporco grossolano intorno a grandi abeti piantati e appena generati.
  spruce-snow:
    label: Neve intorno a a abeti
    description: Posizionare uno strato di neve su terra vuota senza sostituire la neve o le piante esistenti.
  spruce-snow-cold-only:
    label: Spruce neve solo in località fredde
    description: Disabilitare per permettere la neve decorativa intorno a abeti in biomi caldi troppo.
  applied: <green>CustomTrees impostazioni applicate.
  rejected: '<red>Combinazione non valida: {error} – i valori precedenti sono stati ripristinati.'
  section-description: Crescita dell'albero, generazione mondiale, costi catalizzanti, marcatori di fuoco e ricrescita del
    giardino. Selezione mondiale (mondo abilitato) solo nel config.yml.
  custom-player-grown-trees:
    label: Alberi personalizzati da saplings
    description: Sostituisce la crescita di 1×1 e 2×2 saplings con forme albero personalizzate
  connected-shrubs-and-hedges:
    label: Arbusti e siepi
    description: 2–3 gli zaffiri collegati diventano arbusti, 4 o più una siepe
  replace-generated-trees:
    label: Sostituire alberi generati
    description: Sostituisce alberi di generazione mondiale (solo pezzi nuovi)
  replacement-chance:
    label: Possibilità di sostituzione
    description: Quota degli alberi generati che vengono sostituiti (0 = nessuno, 1 = tutti)
  generated-tree-scan-depth:
    label: profondità di scansione
    description: Quanti blocchi sotto la superficie generata alberi sono ricercati
  new-chunk-post-processing:
    label: post-processing a New-chunk
    description: Passare una volta sopra i pezzi appena generati che sostituisce i loro alberi (anche cattura gli oggetti
      tardo Iris)
  new-chunk-post-process-delay-ticks:
    label: Ritardo di post-elaborazione
    description: Ticks fino a quando un nuovo pezzo è post-processed
  giant-3x3-saplings:
    label: Alberi giganti da 3×3
    description: 3×3 zaffiri creano alberi extra-large
  natural-3x3-growth:
    label: 3×3 crescita naturale
    description: Gli alberi giganti crescono anche dalle normali zecche di crescita
  bonemeal-3x3-growth:
    label: 3×3 con pasto osseo
    description: Il pasto Bone innesca alberi giganti immediatamente
  giant-min-height:
    label: 'Gigante: min. altezza'
    description: Deve essere ≤ max. altezza
  giant-max-height:
    label: 'Gigante: altezza massima'
    description: Deve essere ≥ min. altezza
  giant-canopy-radius:
    label: 'Gigante: raggio corona'
    description: Radio della corona in blocchi
  colossal-5x5-saplings:
    label: Colossi da 5×5
    description: 5×5 zaffiri creano alberi colossali
  natural-5x5-growth:
    label: 5×5 crescita naturale
    description: Colossi anche crescere da normali zecche di crescita
  bonemeal-5x5-growth:
    label: 5×5 con pasto osseo
    description: Il pasto Bone innesca colossi immediatamente
  colossal-min-height:
    label: 'Colosso: min. altezza'
    description: Deve essere ≤ max. altezza
  colossal-max-height:
    label: 'Colosso: altezza massima'
    description: Deve essere ≥ min. altezza
  colossal-canopy-radius:
    label: 'Colosso: raggio corona'
    description: Radio della corona in blocchi
  glowstone-growth:
    label: Alberi luminosi (polvere di pietra)
    description: Fare clic con la polvere di lapide cresce un albero luminoso protetto
  glowstone-xp-cost:
    label: 'Albero luminoso: XP costo'
    description: XP punti per albero luminoso in modalità sopravvivenza
  glowstone-leaves-per-block:
    label: 'Albero luminoso: foglie per pietra grezza'
    description: Un glowstone per questo molti blocchi foglia
  glowstone-max-blocks:
    label: 'Albero luminoso: max'
    description: Numero massimo di blocchi di pietre glow per albero
  glowstone-dark-light-level:
    label: 'Albero luminoso: livello di luce scuro'
    description: Lascia fino a questo livello leggero contare come scuro
  glowstone-growth-cooldown-seconds:
    label: Tempo di recupero della crescita di Glowstone (secondi)
    description: Tempo minimo tra alberi di bagliore di successo per giocatore; 0 lo disabilita
  glowstone-growth-daily-limit:
    label: Alberi in pietra per UTC giorno
    description: Alberi glowstone di massimo successo per giocatore per UTC giorno; 0 lo disabilita
  coal-growth:
    label: Alberi di carbone
    description: Fare clic con il carbone cresce un albero non protetto
  coal-growth-cooldown-seconds:
    label: Tempo di recupero della crescita del carbone (secondi)
    description: Tempo minimo tra alberi di carbone di successo per giocatore; 0 lo disabilita
  coal-growth-daily-limit:
    label: Alberi di carbone per UTC giorno
    description: Alberi di carbone massimo successo per giocatore per UTC giorno; 0 lo disabilita
  coal-costs:
    normal:
      label: 'Costo del carbone: normale'
      description: Carbone richiesto per una crescita unica di zaffiro o arbusto (1–64)
    medium:
      label: 'Costo del carbone: medio'
      description: Carbone richiesto per un 2×2 albero (1–64)
    giant:
      label: 'Costo del carbone: gigante'
      description: Carbone richiesto per un 3×3 albero (1–64)
    colossal:
      label: 'Costo del carbone: colossale'
      description: Carbone richiesto per un 5×5 albero (1–64)
    hedge:
      label: 'Costo del carbone: siepe'
      description: Carbone richiesto per una siepe collegata (1–64)
  fire-protect-trunks:
    label: Proteggere i tronchi personalizzati dal fuoco
    description: Protegge i blocchi di tronco tracciati esatti da eventi di masterizzazione diretta; non contiene incendi
      selvatici
  fire-protect-crowns:
    label: Proteggere corone personalizzate da fuoco
    description: Protegge i blocchi di foglie tracciati esatti da eventi di masterizzazione diretta; non contiene incendi
      selvatici
  garden-regrowth-seconds:
    label: Ricrescita foglia di giardino (secondi)
    description: Ritardo prima della ricrescita delle foglie registrate (10–86400 secondi)
