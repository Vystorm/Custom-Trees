      bonemeal:
        title: Pasto di pane
        text: 'Fare clic con il pulsante destro del mouse sulla formazione: cresce subito.'
        cost: Utilizza 1 pasto osseo
      glowstone:
        title: Albero luminoso
        text: 'Fare clic con il pulsante destro del mouse sulla polvere in pietra: un albero protetto con lapide nel fogliame
          interno scuro cresce subito.'
        cost: Utilizza 1 polvere di lapide + {xp} XP punti
        light: Una lapide per {leaves} foglie, al massimo {max} per albero; foglie a livello leggero {light} o più scuro conteggio
          come scuro.
        nodrop: 'Questo glowstone è la decorazione: estrazione mineraria o esplosioni non cadere nulla e pistoni non possono
          spostarlo.'
      coal:
        title: Albero di carbone
        text: 'Fare clic con il carbone: lo stesso albero personalizzato cresce subito, deliberatamente senza protezione del
