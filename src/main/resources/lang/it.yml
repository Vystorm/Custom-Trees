    intro: Gli zaffiri vegetali dello stesso tipo ad un'altezza. La forma del gruppo decide quale albero cresce – la più grande
      formazione completa vince.
    worlds:
      all: Funziona in tutti i mondi normali (overworld).
      some: 'Opere in questi mondi: {worlds}'
    permission: Crescere ha bisogno del permesso {permission} (i giocatori lo hanno per impostazione predefinita).
    priority: 'Ordine dei controlli: 5×5 → 3×3 → 2×2 → hedge/shrubs → single sapling.'
    formations: Formazioni di zaffiro
    formation:
      single:
        title: Sollevamento singolo
        text: Cresce in un albero personalizzato della sua specie in una delle quattro varianti di architettura.
      square:
        title: 2×2 quadrati
        text: Quattro zanne uguali come un quadrato crescono un albero medio-grande con un tronco spesso.
      shrub:
        title: Arbusti
        text: '{min}–{max} gli zaffiri collegati (anche diagonalmente) diventano un gruppo di arbusti.'
      hedge:
        title: Hedge
        text: '{min} o più raccordi collegati – rettilinei, diagonali, angoli o ramificazione, fino a {max} – diventano una
          copertura continua.'
      giant:
        title: Albero gigante (3×3)
        text: Nove sapling uguali come un quadrato privo di spazio crescono un albero extra-large con un 3×3 baule.
      colossal:
        title: Colosso (5)×5)
        text: 25 sapling uguali come un quadrato privo di gap crescere un albero colossale con un tronco rotondo e una corona
          larga.
    size:
      height: '{min}–{max} blocchi alti'
      radius: raggio corona {radius}
    disabled: Disabili su questo server
    legend:
      sapling: Sapore
      target: Fare clic con il pulsante destro del mouse o il pasto osseo qui (qualsiasi sapido della formazione funziona)
    diagram: 'Vista superiore della formazione: {count} saplings'
    trigger:
      natural: Crescita naturale
