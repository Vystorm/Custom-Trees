garden:
  unavailable: Questa azione giardino non è disponibile; controllare le autorizzazioni, Core versione o la salute di stoccaggio.
  no-tree: Guarda le foglie del tuo albero di profilo piantato entro sei isolati.
  denied: Nessuna foglia di corona corrispondente potrebbe essere potuta con i vostri permessi di costruzione attuali.
  pruned: Pruned {count} foglie corona. La ricrescita inizia non prima di {seconds} secondi, mentre sei online e lo spazio
    rimane vuoto.
  sapling-usage: /customtrees sapling <random|open_grown|forest|windswept|ancient> <normal|medium|giant|colossal>. Richiede
    Core 0.26.5 e customtrees.grow.
  single-sapling: Tenere esattamente uno zaffiro non modificato nella mano principale.
  sapling-ready: Profilo di crescita salvato. Piantare il linfatico nel modello di dimensione corrispondente; costi normali
    e regole di protezione ancora si applicano.
  pattern-mismatch: Il profilo salvato richiede il suo modello di dimensione corrispondente. Tagged saplings in uno schema
    deve condividere il profilo e il proprietario.
world-tree:
  invalid-setting: L'impostazione mondiale {setting} deve essere un intero da {min} a {max}.
  preview: '{size}x{size} formazione: altezza {height}, raggio corona {radius}. Fare clic con il menu osseo. Gli ostacoli
    sono cresciuti intorno; gli edifici sono conservati.'
  bonemeal: Utilizzare il pasto osseo per questa formazione. Carbone, pietra glowstone e taggati impianti di profilo non sono
    supportati per questa dimensione.
  busy: Un lavoro di crescita è già in fase di preparazione o di sviluppo. Ti prego, aspetta.
  planning: Preparare il tuo albero del mondo (caricare l'area, pianificare, controllare lo spazio). Nessun pasto osseo viene
    consumato fino all'approvazione della crescita.
  no-room: La crescita dell'albero del mondo si è fermata prima del posizionamento. Controllare le piante, il terreno, le
    aree protette, il vostro permesso e il vostro pasto osseo.
  shrunk: 'Non abbastanza altezza di costruzione: questo albero cresce solo {height} blocchi di altezza (raggio a corona {radius}).'
  too-high: Non c'è abbastanza altezza di costruzione qui per un albero di mondo. Piantare la formazione più bassa.
  too-large: Questa formazione ha bisogno di troppi pezzi. Ridurre l'altezza o il raggio nella configurazione.
  load-failed: L'area intorno all'albero del mondo non poteva essere caricato. Niente è stato consumato; si prega di riprovare
    a breve.
  growing: Crescere l'albero del mondo in fasi ({blocks} blocchi).
  complete: Il tuo albero del mondo ha finito di crescere.
  partial: La crescita dell'albero del mondo si è conclusa con alcuni blocchi lasciati fuori o incompiuti. Gli edifici esistenti
    sono stati conservati.
world-trees:
