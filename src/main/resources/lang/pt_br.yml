      glowstone:
        title: Árvore luminosa
        text: 'Botão direito do mouse com pó de pedra brilhante: uma árvore protegida com pedra brilhante em sua folhagem
          interior escura cresce ao mesmo tempo.'
        cost: Usa 1 pó de pedra brilhante + {xp} XP pontos
        light: Uma pedra brilhante por {leaves} folhas, no máximo {max} por árvore; folhas em nível claro {light} ou contagem
