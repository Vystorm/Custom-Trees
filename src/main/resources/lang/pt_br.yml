garden:
  unavailable: Esta ação no jardim não está disponível, cheque permissões, versão central ou saúde de armazenamento.
  no-tree: Olhe as folhas de sua árvore plantada dentro de seis quarteirões.
  denied: Nenhuma folha da coroa poderia ser podada com suas atuais permissões de construção.
  pruned: Pruned {count} folhas de coroa. O crescimento não começa antes de {seconds} segundos, enquanto você está online
    e o espaço permanece vazio.
  sapling-usage: /customtrees sapling <random|open_grown|forest|windswept|ancient> <normal|medium|giant|colossal>. Requer
    Core 0.26.5 e customtrees.grow.
  single-sapling: Mantenha exatamente uma muda não modificada em sua mão principal.
  sapling-ready: Perfil de crescimento salvo. Coloque a muda no padrão de tamanho correspondente, custos normais e regras
    de proteção ainda se aplicam.
  pattern-mismatch: O perfil salvo requer seu padrão de tamanho. As mudas marcadas em um padrão devem compartilhar o perfil
    e o dono.
world-tree:
  invalid-setting: A configuração mundial das árvores {setting} deve ser um inteiro de {min} a {max}.
  preview: '{size}x{size} formação: altura {height}, raio da coroa {radius}. Botão direito com farinha de osso. Obstáculos
    são cultivados ao redor, edifícios são preservados.'
  bonemeal: Use farinha de osso para esta formação. Carvão, pedras brilhantes e plantas marcadas não são suportadas para este
    tamanho.
  busy: Um trabalho de crescimento já está sendo preparado ou crescido. Por favor, espere.
  planning: Preparando sua árvore mundial (carregando a área, planejando, checando espaço). Nenhuma refeição óssea é consumida
    até que o crescimento seja aprovado.
  no-room: O crescimento das árvores do mundo parou antes da colocação. Verifique as plantas, solo, áreas protegidas, sua
    permissão e sua refeição de ossos.
  shrunk: 'Não há altura suficiente de construção: esta árvore cresce apenas {height} blocos de altura (raio da coroa {radius}).'
  too-high: Não há altura suficiente para construir uma árvore do mundo. Plante a formação mais baixo.
  too-large: Esta formação precisa de muitos pedaços. Reduzir a altura ou raio na configuração.
  load-failed: A área ao redor da árvore mundial não poderia ser carregada. Nada foi consumido, por favor tente novamente
    em breve.
  growing: Crescendo sua árvore mundial em estágios ({blocks} blocos).
  complete: Sua árvore mundial terminou de crescer.
  partial: O crescimento da árvore mundial terminou com alguns blocos deixados de lado ou inacabados. Prédios existentes foram
    preservados.
world-trees:
  enabled:
    label: Árvores e fungos do mundo
    description: Configurar crescimento explícito de 10x10. Dimensões incluem a coroa, obstáculos são cultivados ao redor
      e árvores que não se encaixam são encolhidas.
