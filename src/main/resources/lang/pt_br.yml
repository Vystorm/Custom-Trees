    loading: Carregando o guia da árvore...
    error: 'O guia da árvore não pôde ser carregado: {error}'
    intro: Plantar mudas do mesmo tipo em uma altura. A forma do grupo decide qual árvore cresce - a maior formação completa
      ganha.
    worlds:
      all: Funciona em todos os mundos normais.
      some: 'Trabalha nestes mundos: {worlds}'
    permission: Crescer precisa da permissão {permission} (os jogadores a têm por padrão).
    priority: 'Ordem de cheques: 5×5 → 3×3 → 2×2 → Sebes/Arbustos → Uma única muda.'
    formations: Formações Sapling
    formation:
      single:
        title: Uma única muda
        text: Cresce em uma árvore personalizada de sua espécie em uma das quatro variantes de arquitetura.
      square:
        title: 2×2 quadrado
        text: Quatro mudas iguais como um quadrado crescer uma árvore média-grande com um tronco grosso.
      shrub:
        title: Arbustos
        text: '{min}-{max} mudas conectadas (também diagonalmente) tornam-se um grupo de arbustos.'
      hedge:
        title: Sede
        text: '{min} ou mais mudas conectadas - retas, diagonais, em torno de cantos ou ramificações, até {max} - se tornam
          uma sebe contínua.'
      giant:
        title: Árvore gigante (3)×3)
        text: Nove mudas iguais como um quadrado livre de abertura crescer uma árvore extra-grande com um 3×3 porta-malas.
      colossal:
        title: Colossus (5)×5)
        text: 25 mudas iguais como um quadrado livre de abertura crescer uma árvore colossal com um tronco redondo e uma coroa
          larga.
