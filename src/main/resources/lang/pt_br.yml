settings:
  spruce-ground:
    label: Floor da floresta de Spruce
    description: Podzol e sujeira grossa ao redor de grandes plantas e abetos recém-gerados.
  spruce-snow:
    label: Neve ao redor de abetos
    description: Coloque uma camada de neve em solo vazio sem substituir neve ou plantas existentes.
  spruce-snow-cold-only:
    label: Neve de abeto só em locais frios
    description: Desativar para permitir neve decorativa em torno de abetos em biomas quentes também.
  applied: <green>CustomTrees configurações aplicadas.
  rejected: '<red>Combinação inválida: {error} - os valores anteriores foram restaurados.'
  section-description: Crescimento de árvores, geração mundial, custos com catalisadores, marcadores de fogo e crescimento
    de jardim. Seleção mundial só em config.yml.
  custom-player-grown-trees:
    label: Árvores personalizadas de mudas
    description: Substitui o crescimento de 1×1 e 2×2 mudas com formas de árvores personalizadas
  connected-shrubs-and-hedges:
    label: Arbustos e sebes
    description: 2-3 mudas conectadas tornam-se arbustos, 4 ou mais uma sebe
  replace-generated-trees:
    label: Substituir árvores geradas
    description: Substitui árvores da geração mundial (apenas novos pedaços)
  replacement-chance:
    label: Possibilidade de substituição
    description: (0 = nenhum, 1 = todos)
  generated-tree-scan-depth:
    label: Examine a profundidade
    description: Quantos blocos abaixo da superfície gerada por árvores são procurados
  new-chunk-post-processing:
    label: Pós-processamento New-chunk
    description: Uma vez passar por cima de pedaços recém-gerados que substitui suas árvores (também pega objetos da Iris
      tardia)
  new-chunk-post-process-delay-ticks:
    label: Atraso pós-processamento
    description: Tiquetaque até que um novo pedaço seja processado
  giant-3x3-saplings:
    label: Árvores gigantes de 3×3
    description: 3×3 mudas criam árvores muito grandes
  natural-3x3-growth:
    label: 3×3 crescimento natural
    description: Árvores gigantes também crescem de carrapatos de crescimento normais
  bonemeal-3x3-growth:
    label: 3×3 com farinha de osso
    description: A refeição de ossos desencadeia árvores gigantes imediatamente
  giant-min-height:
    label: 'Gigante: altura mínima'
    description: Deve ser ≤ altura máxima
  giant-max-height:
    label: 'Gigante: altura máxima'
    description: Deve ter uma altura mínima
  giant-canopy-radius:
    label: 'Gigante: raio da coroa'
    description: Raio da coroa em blocos
  colossal-5x5-saplings:
    label: Colossi de 5×5
    description: 5×5 mudas criam árvores colossais
  natural-5x5-growth:
    label: 5×5 crescimento natural
    description: Colossi também cresce de carrapatos de crescimento normais
  bonemeal-5x5-growth:
    label: 5×5 com farinha de osso
    description: Refeição óssea provoca colossi imediatamente
  colossal-min-height:
    label: 'Colosso: altura mínima'
    description: Deve ser ≤ altura máxima
  colossal-max-height:
    label: 'Colosso: altura máxima'
    description: Deve ter uma altura mínima
  colossal-canopy-radius:
    label: 'Colosso: raio da coroa'
    description: Raio da coroa em blocos
  glowstone-growth:
    label: Árvores luminosas (pó de pedra brilhante)
    description: Botão direito do mouse com pó de pedra brilhante cresce uma árvore luminosa protegida
  glowstone-xp-cost:
    label: 'Árvore luminosa: XP custam'
    description: XP pontos por árvore luminosa em modo de sobrevivência
  glowstone-leaves-per-block:
    label: 'Árvore luminosa: folhas por pedra brilhante'
    description: Uma pedra brilhante por tantos blocos de folhas
  glowstone-max-blocks:
    label: Árvore luminosa, máx
    description: Número máximo de blocos de pedra brilhante por árvore
  glowstone-dark-light-level:
    label: Árvore luminosa, nível de luz escura
    description: Deixa até este nível de luz contar como escuro
  glowstone-growth-cooldown-seconds:
    label: Tempo de recuperação de Glowstone
    description: Tempo mínimo entre árvores de brilho bem sucedidas por jogador; 0 desativa
  glowstone-growth-daily-limit:
    label: Árvores de pedra brilhante por UTC dias
    description: Máximas árvores de brilho de sucesso por jogador por UTC dias; 0 desativa
  coal-growth:
    label: Árvores de carvão
    description: O botão direito do mouse com carvão cresce uma árvore desprotegida
  coal-growth-cooldown-seconds:
    label: Tempo de recuperação do carvão (segundos)
    description: Tempo mínimo entre árvores de carvão bem sucedidas por jogador; 0 desativa
  coal-growth-daily-limit:
    label: Árvores de carvão por UTC dias
    description: Máximas árvores de carvão bem sucedidas por jogador por UTC dias; 0 desativa
  coal-costs:
    normal:
      label: 'Custo do carvão: normal'
      description: Carvão necessário para uma única muda ou crescimento de arbustos (1-64)
    medium:
      label: 'Custo do carvão: médio'
      description: Carvão necessário para um 2×2 árvores (1-64)
    giant:
      label: 'Custo do carvão: gigante'
      description: Carvão necessário para um 3×3 árvores (1-64)
    colossal:
      label: 'Custo do carvão: colossal'
      description: Carvão necessário para um 5×5 árvores (1-64)
    hedge:
      label: 'Custo do carvão: hedge'
      description: Carvão necessário para uma sebe conectada (1–64)
  fire-protect-trunks:
    label: Protejam os troncos personalizados do fogo
    description: Protege exatamente os troncos rastreados de eventos de queimadura direta, não contém incêndios
  fire-protect-crowns:
    label: Proteja coroas personalizadas do fogo
    description: Protege os blocos de folhas rastreados de eventos de queimaduras diretas, não contém incêndios
  garden-regrowth-seconds:
    label: Rebrota de folhas de jardim (segundos)
    description: Atraso antes de podar com sucesso folhas registradas crescer (10-86400 segundos)
  garden-max-trees:
    label: "Árvores de jardim (servidor inteiro)"
    description: "Quantas árvores de perfil o servidor guarda para poda; novas árvores além disso não são registradas (16–1024)"
web:
  module:
