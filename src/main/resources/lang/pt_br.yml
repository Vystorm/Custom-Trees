        nodrop: 'Esta pedra brilhante é decoração: mineração ou explosões não deixam cair nada e pistões não podem movê-la.'
      coal:
        title: Árvore de carvão
        text: 'Botão direito do mouse com carvão: a mesma árvore personalizada cresce ao mesmo tempo, deliberadamente sem
