garden:
  unavailable: Это действие в саду недоступно; проверьте разрешения, базовую версию или здоровье хранилища.
  no-tree: Посмотрите на листья посаженного дерева в шести кварталах.
  denied: Никакие соответствующие листья короны не могут быть обрезаны с вашими текущими разрешениями на строительство.
  pruned: Обрезанные {count} листьев короны. Рост начинается не ранее {seconds} секунд, пока вы находитесь в сети и пространство
    остается пустым.
  sapling-usage: /customtrees sapling <random|open_grown|forest|windswept|ancient> <normal|medium|giant|colossal>. Требуется
