  preview: '{size}x{size} образование: высота {height}, радиус короны {radius}. Правильно щелкните костной едой. Возникли
    препятствия, здания сохранились.'
  bonemeal: Используйте костную муку для этого образования. Уголь, светящийся камень и помеченные профильные растения не поддерживаются
    для такого размера.
