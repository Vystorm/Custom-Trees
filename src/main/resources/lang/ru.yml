    description: 'Самый большой квадрат помощник предлагает: 2, 3, 5 или 10.'
  keep-active:
    label: Будьте активны
    description: Держите помощника включенным после того, как квадрат был посажен.
  timeout-seconds:
    label: Время выключения (секунды)
    description: Неиспользованный помощник выключается после этого времени.
timber:
  progress: <gray>мусор <white>{chopped}/{required}</white> нарезанный
  busy: <gray>Слишком много деревьев сейчас падает; этот бревно сломалось само по себе.
  too-large: <gray>Это дерево слишком большое или тянется в незагруженную землю; только бревно сломалось.
  protected: <red>Часть этого дерева защищена, она остается на месте.
  tool-spared: <gold>Твой топор сломался бы; только этот бревно рубили.
  player:
    title: древесина
    description: Упали целые деревья топором
    locked: Сервер решает это для всех.
    mode-server: Сервер по умолчанию
    mode-drop: Прямо вниз
    mode-fall: Падение деревьев
    use:
      label: древесина
      description: Отрубив бревно топором, выпало все дерево.
    mode:
      label: Как спускаются деревья
      description: 'Прямо вниз: дерево ломается снизу вверх. Дерево падает: оно отваливается от вас и превращается в предметы.'
  choice:
    fall: Падение деревьев
    drop: Прямо вниз
    first-log: Первый лог
    percent: Процент багажника
    standing: Только когда стоишь
    sneaking: Только когда ты прячешься
    any: Всегда
    server-mode: Режим работы сервера
    disabled: Никогда
    vanilla: Как ваниль
    none: Ничего
    pause: Пауза встроенной древесины
    run-both: Бегите оба
  enabled:
    label: древесина
    description: Отрубив бревно дерева топором, выпадает все дерево. Игровые сборки никогда не падают.
  mode:
    label: Как спускаются деревья
    description: Падение = дерево падает от игрока вокруг пня и превращается в предметы; падение = оно ломается прямо снизу
      вверх.
  trigger:
    label: Когда дерево падает
    description: first-log = при первом рубленном бревне; % = после того, как установленная доля поперечного сечения туловища
      разрезается.
  trunk-percent:
    label: Уменьшение доли мусора (%)
    description: 'Процент триггера: доля поперечного сечения туловища, которая должна быть разрублена до падения дерева.'
  sneaking:
    label: крадущийся
    description: стоя = древесина только тогда, когда она не подкрадывается (подкрадывается, чтобы рубить отдельные бревна);
      подкрадывание = только во время подкрадывания; любое = всегда.
  require-axe:
    label: Требуемый топор
    description: Древесина работает только с топором в главной руке.
  worlds:
    label: Миры
    description: Миры, где работает древесина; пустой = каждый мир.
  player-choice:
    label: Игроки выбирают
    description: Игроки могут отключить древесину для себя и выбрать дерево, падающее или падающее прямо на землю /vsettings.
  tree-types:
    small:
      label: Маленькие деревья
      description: 'Одиночные и 2x2 деревьев, кустарников и изгородей: серверный режим, падение, падение или выключение.'
    giant:
      label: 3x3 гигантов
      description: 'Гигантские деревья из 3x3 саженцев: серверный режим, падение, падение или выключение.'
    colossal:
      label: 5x5 колоссов
      description: 'Колоссальные деревья из 5x5 саженцев: серверный режим, падение, падение или выключение.'
    world:
      label: Мировые деревья
      description: '10x10 мировых деревьев и других огромных деревьев: серверный режим, падение, падение или выключение.'
  tool:
    durability-per-log:
      label: Носить по бревну
      description: Точки прочности топор теряет за срубленное бревно (применяется Unbreaking).
    spare-tool:
      label: Запаси топор
      description: Не падайте на дерево, когда топор ломается; тогда ломается только рубленное бревно.
  drops:
    leaves:
      label: Листья капают
      description: Ваниль = листья капли саженцы, палочки и яблоки, как ваниль (фортуна помогает, шелковый прикосновение держит
        листья); ни один = ничего.
    into-inventory:
      label: В инвентарь
      description: Сброшенные предметы идут прямо в инвентарь; то, что не подходит землям на земле.
  replant:
    label: пересаживать
    description: После падения небольшого дерева высаживается подходящий саженец, где стоял его ствол (четыре на 2x2) - из
      капель дерева, еще из инвентаря.
  detection:
    max-blocks:
      label: Макс, блоки на дерево
      description: Деревья с большим количеством бревен и листьев не вырубаются.
    max-radius:
      label: Макс, радиус
      description: Как далеко дерево может достичь боков от рубленного бревна.
    max-height:
      label: Макс, высота
      description: Как высоко дерево может подняться над срезом.
    min-leaves:
      label: Мин. Листья
      description: Дерево нуждается, по крайней мере, в этом количестве натуральных листьев (или шапок для грибов и грибов).
    natural-ground:
      label: Природная земля
      description: Ствол должен стоять на естественной почве, такой как грязь, трава, песок, камень или нилий.
    coreprotect-check:
      label: Проверка CoreProtect
      description: 'С CoreProtect: никогда не падал бревна размещенного игрока.'
    only-generated-trees:
      label: Только генерируемые деревья
      description: Только упавшие деревья CustomTrees выросли или породили (или, с CoreProtect, деревья не были размещены).
  fall:
    max-displays:
      label: Max. дисплей на дерево
      description: Показать объекты падающего дерева; большие деревья показаны с слитыми кубами.
    fall-ticks:
      label: Продолжительность падения (тиксы)
      description: Продолжительность полного падения клещей (20 = 1 секунда).
  performance:
    blocks-per-tick:
      label: Блоки на клеща
      description: Блоки удаляются на клеща, разделяемые всеми падающими деревьями.
    checks-per-tick:
      label: Проверка на клеща
      description: Проверки защиты (события прорыва) на клеща, разделяемые всеми падающими деревьями.
    falls-per-world:
      label: Падение в мире
      description: Деревья падают одновременно в одном мире.
    falls-per-player:
      label: Падение на одного игрока
      description: Деревья одного игрока могут падать одновременно.
  other-timber-plugins:
    label: Другие деревянные плагины
    description: Пауза = выключите встроенную древесину во время установки SmoothTimber или другого плагина для древесины;
      запустите оба = сохраните оба.
  percent-memory-seconds:
    label: Память о порезах (секундах)
    description: 'Процентный триггер: как долго полуразрезанный багажник помнит свои разрезы.'
  protected-region-kinds:
    label: Типы охраняемых районов
    description: Vystorm Основные виды, где древесина ничего не удаляет; древесина флага области перекрывает его.
commands:
  customtrees:
    description: 'Обычные деревья: руководство по дереву, помеченные саженцы, обрезка, посадка помощника и гербарий'
    aliases: []
    sub:
      breed:
        name: "breed"
        aliases: []
        description: "Скрестить два профильных саженца в руках"
      guide:
        name: guide
        aliases: []
        description: Откройте проводник дерева (web page or in-game tutorial); также /customtrees web
        args:
          page: Руководитель | Виды | Админ
      sapling:
        name: sapling
        aliases: []
        description: Превратите саженец в руке в саженец с формой короны и размером
        usage: FORM SIZE
        args:
          form: FORM
          size: SIZE
      prune:
        name: prune
        aliases: []
        description: Обрезать венец своего садового дерева, на который вы смотрите
      plant:
        name: plant
        aliases: []
        description: 'Посадочный помощник: квадраты и ряды изгороди (меню, размер, изгородь или выключение)'
        args:
          size: 2x2 |3x3 |5x5 |10x10 |hedge4..hedge32 |off
      herbarium:
        name: herbarium
        aliases: []
        description: Ваш гербарий, гербарий другого игрока или верхний список
        args:
          player: PLAYER |top
      next:
        name: next
        aliases: []
        description: Предложите отсутствующую форму гербария с инструкциями по посадке
        args:
          plant: PLANT
      status:
        name: status
        aliases: []
        description: Показать активные настройки и статус функции
      reload:
        name: reload
        aliases: []
        description: Перезагрузка конфигурационных и языковых файлов
    values:
      status: состояние
      guide: руководство
      species: виды
      admin: админ
      top: вершина

