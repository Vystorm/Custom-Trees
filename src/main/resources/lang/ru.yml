  giant-canopy-radius: Гигантское навесное излучение должно быть между {min} и {max}.
  colossal-heights: Колоссальные высоты должны удовлетворять {min} <= мин <= макс <= {max}.
  colossal-canopy-radius: Колоссальное навесное излучение должно быть между {min} и {max}.
  glowstone-xp-cost: Стоимость свечения должна составлять от {min} до {max}.
  generated-tree-scan-depth: Углубленность сгенерированного дерева должна составлять от {min} до {max}.
  glowstone-leaves-per-block: Светящиеся листья на блок должны быть между {min} и {max}.
  glowstone-max-blocks: Стеклянные блоки должны быть между {min} и {max}.
  glowstone-dark-light-level: Уровень темного света должен быть между {min} и {max}.
  new-chunk-post-process-delay-ticks: Новые брелоки должны быть между {min} и {max}.
  catalyst-cooldown: Время восстановления роста {catalyst} должно составлять от {min} до {max}.
  catalyst-daily-limit: '{catalyst}-рост-суточный лимит должен быть между {min} и {max}.'
  coal-costs-section: settings.coal-costs должен быть секцией YAML.
  coal-growth-cost: Стоимость угля.{growthClass} должна составлять целое число от {min} до {max}.
  biome-profiles-root: Биом-профили должны быть секции YAML.
  biome-profiles-limit: Допускается не более {max} групп профилей биомов.
  biome-profiles-biome-limit: Допускается максимум {max} биомов.
  biome-profile-id: 'Недействительный профиль биома: {id}.'
  biome-profile-group: Биомный профиль {id} должен быть сечением YAML.
  biome-profile-biomes: Профиль биома {id} должен содержать как минимум один биом.
  biome-profile-number: Биомный профиль {id} имеет недействительное числовое значение {field}.
  biome-profile-scale: 'Профиль биома {id}: {field} должен быть между {min} и {max}.'
  biome-profile-form: 'Профиль биома {id} имеет неизвестную форму короны: {form}.'
  biome-profile-chance: 'Профиль биома {id}: вероятность замены должна составлять от {min} до {max}.'
  biome-profile-biome-key: 'Профиль биома {id} имеет недействительный ключ биома: {biome}.'
  biome-profile-unknown-biome: 'Профиль биома {id} ссылается на неизвестный биом: {biome}.'
  biome-profile-duplicate-biome: Биом {biome} присваивается более чем одному профилю.
  biome-profiles-core: Непустые биом-профили требуют Vystorm Core 0.26.5 или новее с TREE_GROWTH_PROFILES.
settings:
  spruce-ground:
    label: еловой лесной пол
    description: Подзол и грубая грязь вокруг крупных посаженных и вновь сгенерированных ели.
  spruce-snow:
    label: Снег вокруг ели
    description: Поместите слой снега на пустую землю без замены существующего снега или растений.
  spruce-snow-cold-only:
    label: Снег только в холодных местах
    description: Отключить, чтобы декоративный снег вокруг ели в теплых биомах тоже.
  applied: <green>Применяется CustomTrees установок.
  rejected: '<red>Недействительное сочетание: {error} – восстановлены прежние значения.'
  section-description: Рост деревьев, мировое поколение, затраты на катализаторы, маркеры пожара и восстановление сада. Мировой
    отбор (enabled-worlds) только в config.yml.
  custom-player-grown-trees:
    label: Обычные деревья из саженцев
    description: Замещает рост 1×1 и 2×2 саженцев с обычными формами деревьев
  connected-shrubs-and-hedges:
    label: Крубы и изгороди
    description: 2–3 соединенные саженцы становятся кустарниками, 4 или более изгородью
  replace-generated-trees:
    label: Заменить сгенерированные деревья
    description: Замена деревьев мирового поколения (только новые чанки)
  replacement-chance:
    label: Возможность замены
    description: Доля сгенерированных деревьев, которые заменяются (0 = нет, 1 = все)
  generated-tree-scan-depth:
    label: Глубина сканирования
    description: Сколько блоков под поверхностью породили деревья
  new-chunk-post-processing:
    label: Новая постобработка
    description: Одноразовый проход над вновь сгенерированными чанками, которые заменяют их деревья (также ловит поздние объекты
      Айрис)
  new-chunk-post-process-delay-ticks:
    label: Задержка после обработки
    description: Клещи, пока новый чанк не будет постобработан
  giant-3x3-saplings:
    label: Гигантские деревья от 3×3
    description: 3×3 саженцев создают деревья
  natural-3x3-growth:
    label: 3×3 естественный рост
    description: Гигантские деревья растут из нормальных клещей
  bonemeal-3x3-growth:
    label: 3×3 с костной мукой
    description: Костная мука немедленно вызывает гигантские деревья
  giant-min-height:
    label: 'Гигант: мин. высота'
    description: Должно быть ≤ max. высота
  giant-max-height:
    label: 'Гигант: макс. высота'
    description: Должно быть ≥ мин. высота
  giant-canopy-radius:
    label: 'Гигант: радиус короны'
    description: Радиус короны в блоках
  colossal-5x5-saplings:
    label: Колосси от 5×5
    description: 5×5 саженцев создают колоссальные деревья
  natural-5x5-growth:
    label: 5×5 естественный рост
    description: Колосси также растет из нормальных клещей роста
  bonemeal-5x5-growth:
    label: 5×5 с костной мукой
    description: Костная мука вызывает колоссы немедленно
  colossal-min-height:
    label: 'Колосс: мин. высота'
    description: Должно быть ≤ max. высота
  colossal-max-height:
    label: 'Колосс: макс. высота'
    description: Должно быть ≥ мин. высота
  colossal-canopy-radius:
    label: 'Колосс: радиус короны'
    description: Радиус короны в блоках
  glowstone-growth:
    label: Светящиеся деревья (светящаяся пыль)
    description: Правый щелчок светящейся пылью вырастает защищенное светящееся дерево
  glowstone-xp-cost:
    label: 'Светящееся дерево: XP'
    description: XP точек на светящееся дерево в режиме выживания
  glowstone-leaves-per-block:
    label: 'Светящееся дерево: листья на свечение'
    description: Один светящийся камень на столько листовых блоков
  glowstone-max-blocks:
    label: 'Светящееся дерево: max. glowstone'
    description: Максимальное количество блоков свечения на дерево
  glowstone-dark-light-level:
    label: 'Светящееся дерево: уровень темного света'
    description: Листья до этого уровня света считаются темными
  glowstone-growth-cooldown-seconds:
    label: Время восстановления роста Glowstone (секунды)
    description: Минимальное время между успешными деревьями на одного игрока; 0 отключены
  glowstone-growth-daily-limit:
    label: Глоустоновые деревья за UTC дней
    description: Максимально успешные светящиеся деревья на одного игрока за UTC дней; 0 отключены
  coal-growth:
    label: Угольные деревья
    description: Правое щелчок с углем вырастает незащищенное дерево
  coal-growth-cooldown-seconds:
    label: Время восстановления роста угля (секунды)
    description: Минимальное время между успешными угольными деревьями на одного игрока; 0 отключены
  coal-growth-daily-limit:
    label: Угольные деревья за UTC дней
    description: Максимально успешные угольные деревья на одного игрока за UTC дней; 0 отключены
  coal-costs:
    normal:
      label: 'Стоимость угля: нормальная'
      description: Уголь, необходимый для роста одного саженца или кустарника (1–64)
    medium:
      label: 'Стоимость угля: Средняя'
      description: Уголь, необходимый для 2×2 деревьев (1–64)
    giant:
      label: 'Стоимость угля: гигантский'
      description: Уголь, необходимый для 3×3 деревьев (1–64)
    colossal:
      label: 'Стоимость угля: колоссальная'
      description: Уголь, необходимый для 5×5 деревьев (1–64)
    hedge:
      label: 'Стоимость угля: хеджирование'
      description: Уголь, необходимый для подсоединенного хеджирования (1–64)
  fire-protect-trunks:
    label: Защита пользовательских стволов от огня
    description: Защищает точные гусеничные блоки от прямых ожогов; не содержит лесных пожаров
  fire-protect-crowns:
    label: Защитить короны от огня
    description: Защищает точные гусеничные блоки листьев от прямых ожогов; не содержит лесных пожаров
  garden-regrowth-seconds:
    label: Восстановление садовых листьев (секунды)
    description: Задержка перед успешной обрезкой зарегистрированных листьев (10–86400 секунда)
web:
  module:
    title: Путеводитель по деревьям
    description: 'Как саженцы вырастают в обычные деревья: образования, виды, катализаторы и затраты'
  error:
    reload-failed: 'Перезагрузка не удалась; предыдущие настройки остаются активными: {error}'
    no-permission: У вас нет на это разрешения.
    not-ready: CustomTrees еще не готовы.
  ui:
    tab:
      guide: Как расти
      species: Виды
      admin: администратор
    loading: Погрузка проводника дерева...
    error: 'Дерево-гид не удалось загрузить: {error}'
    intro: Растения одного вида на одной высоте. Форма группы решает, какое дерево растет — выигрывает самое большое полное
      образование.
    worlds:
      all: Работает во всех нормальных (мировых) мирах.
      some: 'Работы в этих мирах: {worlds}'
    permission: Растет потребность в разрешении {permission} (у игроков оно есть по умолчанию).
    priority: 'Порядок проведения проверок: 5×5 → 3×3 → 2×2 → хеджирование/шрубы → одиночный саженец.'
    formations: Саблеобразующие образования
    formation:
      single:
        title: Одиночный саженец
        text: Растет в обычном дереве своего вида в одном из четырех вариантов архитектуры.
      square:
        title: 2×2 квадратных
        text: Четыре равных саженца, как квадрат, вырастают дерево среднего размера с толстым стволом.
      shrub:
        title: кустарники
        text: '{min}–{max} соединенные саженцы (также по диагонали) становятся группой кустарников.'
      hedge:
        title: хедж
        text: '{min} или более соединенных саженцев - прямые, диагональные, за углом или ветвящиеся, до {max} - становятся
          непрерывной изгородью.'
      giant:
        title: Гигантское дерево (3)×3)
        text: Девять равных саженцев в виде квадрата без зазора вырастают сверхбольшим деревом с 3×3 багажников.
      colossal:
        title: Колосс (5)×5)
        text: 25 равных саженцев как безразмерный квадрат вырастают колоссальное дерево с круглым стволом и широкой короной.
    size:
      height: '{min}–{max} блоков высотой'
      radius: радиус короны {radius}
    disabled: отключены на этом сервере
    legend:
      sapling: саженец
      target: Правый щелчок или костная мука здесь (любой саженец пласта работает)
    diagram: 'Верхний вид образования: {count} саженцев'
    trigger:
      natural: Естественный рост
      bonemeal: Костная мука
      glowstone: Глоустонская пыль
      coal: уголь
      'off': '{trigger}: выключено'
    protected: Защищенный багажник
    fellable: сокрушительный
    catalysts: Катализаторы и затраты
    catalyst:
      bonemeal:
        title: Костная мука
        text: 'Правильно щелкните саженец образования: оно растет сразу.'
        cost: Использует 1 костной муки
      glowstone:
        title: Светящееся дерево
        text: 'Правый щелчок с пылевой пылью: защищенное дерево со свечением в его темной внутренней листве растет сразу.'
        cost: Использует 1 пылевой пыли + {xp} XP точек
        light: Один светящийся камень на {leaves} листьев, максимум {max} на дерево; листья на уровне света {light} или более
          темные считаются темными.
        nodrop: 'Этот светящийся камень является украшением: добыча полезных ископаемых или взрывы ничего не сбрасывают и
          поршни не могут его перемещать.'
      coal:
        title: угольное дерево
        text: 'Нажмите правой кнопкой мыши на уголь: одно и то же специальное дерево растет сразу, сознательно без защиты
          багажника, поэтому плагины, падающие на дерево, могут разрезать его.'
        cost: Использует 1 угля
      creative: В творческом режиме катализаторы и XP бесплатны.
      refund: Если дерево не может расти (без помещения, охраняемой территории), катализатор и XP возвращаются.
    tips: Хорошо знать
    room: Держите пространство над всем образованием свободным. Деревья заменяют только воздух, траву, папоротники, виноградные
      лозы, натуральные листья и собственные саженцы — никогда другие блоки.
    protection: С CoreProtect стволов 3×3, 5×5 и светящиеся деревья регистрируются как размещенные блоки, поэтому SmoothTimber
      их не вырубает. 1×1, 2×2, кустарники, изгороди и угольные деревья остаются пригодными для вырубки.
    generation:
      'on': 'Мировое поколение: в новых чанках {chance} сгенерированных деревьев заменены одинаковыми заказными формами.'
      'off': 'Мировое поколение: генерируемые деревья не заменяются на этом сервере.'
    compare:
      title: Сравнение размеров
      single: 1×1 деревьев
      giant: 3×3 гигантских
      colossal: 5×5 колосс
      player: Игрок
      caption: Максимальная высота в блоках; игрок имеет высоту 2 блоков.
      blocks: '{height} блоков'
    species:
      intro: Каждый вид имеет свою базовую форму и растет в четырех вариантах архитектуры.
      height: 'Одно дерево: {min}–{max} блоков'
      'off': На этом сервере отключены пользовательские деревья из одиночных саженцев; 3×3 и 5×5 формирований все еще могут
        работать.
      oak: дуб
      birch: берёза
      spruce: ель
      jungle: Джунгли
      acacia: Акация
      dark_oak: Темный дуб
      mangrove: Мангровый
      cherry: Вишня
      pale_oak: Бледный дуб
    variants: Варианты
    variant:
      open-grown: самостоятельный
      forest: лес
      windswept: изгиб ветра
      ancient: Старое дерево
    shape:
