    description: "伐木仅在主手持斧时生效。"
  worlds:
    label: "世界"
    description: "伐木生效的世界；留空 = 所有世界。"
  player-choice:
    label: "玩家自选"
    description: "玩家可在 /vsettings 中为自己关闭伐木，并选择树木倒下或直接掉落。"
  tree-types:
    small:
      label: "小型树"
      description: "单株和 2x2 树、灌木和树篱：server-mode、fall、drop 或 disabled。"
    giant:
      label: "3x3 巨树"
      description: "由 3x3 树苗长成的巨树：server-mode、fall、drop 或 disabled。"
    colossal:
      label: "5x5 巨像"
      description: "由 5x5 树苗长成的巨像树：server-mode、fall、drop 或 disabled。"
    world:
      label: "世界树"
      description: "10x10 世界树和其他巨大树木：server-mode、fall、drop 或 disabled。"
  tool:
    durability-per-log:
      label: "每块原木磨损"
      description: "每砍倒一块原木斧损失的耐久度（耐久附魔生效）。"
    spare-tool:
      label: "保护斧"
      description: "斧即将损坏时不砍倒整棵树；此时只破坏被砍的那块原木。"
  drops:
    leaves:
      label: "树叶掉落"
      description: "vanilla = 树叶像原版一样掉落树苗、木棍和苹果（时运有效，精准采集保留树叶）；none = 不掉落。"
    into-inventory:
      label: "放入物品栏"
      description: "砍下的物品直接进入物品栏；放不下的掉落在地上。"
  replant:
    label: "自动补种"
    description: "砍倒小型树后，在原树干位置种下对应的树苗（2x2 种四棵）——优先使用这棵树掉落的树苗，否则从物品栏取。"
  detection:
    max-blocks:
      label: "每棵树方块上限"
      description: "原木和树叶超过此数量的树不会被砍倒。"
    max-radius:
      label: "最大半径"
      description: "树从被砍原木向侧面延伸的最大距离。"
    max-height:
      label: "最大高度"
      description: "树在切口上方延伸的最大高度。"
    min-leaves:
      label: "最少树叶"
      description: "树至少需要这么多天然树叶（蘑菇和菌类则为伞盖）。"
    natural-ground:
      label: "天然地面"
      description: "树干必须立于泥土、草方块、沙子、石头或菌岩等天然地面上。"
    coreprotect-check:
      label: "CoreProtect 检查"
      description: "安装 CoreProtect 时：绝不砍倒玩家放置的原木。"
    only-generated-trees:
      label: "仅限生成的树"
      description: "只砍倒 CustomTrees 种出或生成的树（或在安装 CoreProtect 时，非玩家放置的树）。"
  fall:
    max-displays:
      label: "每棵树展示实体上限"
      description: "倒下的树使用的展示实体数；更大的树会用合并的方块显示。"
    fall-ticks:
      label: "倒下时长（刻）"
      description: "一次完整倒下所需的刻数（20 = 1 秒）。"
  performance:
    blocks-per-tick:
      label: "每刻方块数"
      description: "每刻移除的方块数，由所有正在倒下的树共享。"
    checks-per-tick:
      label: "每刻检查数"
      description: "每刻的保护检查（破坏事件）数，由所有正在倒下的树共享。"
    falls-per-world:
      label: "每个世界倒树数"
      description: "一个世界中同时倒下的树的数量。"
    falls-per-player:
      label: "每位玩家倒树数"
      description: "一位玩家同时可以有多少棵树在倒下。"
  other-timber-plugins:
    label: "其他伐木插件"
    description: "pause = 安装 SmoothTimber 或其他伐木插件时关闭内置伐木；run-both = 两者同时保留。"
  percent-memory-seconds:
    label: "砍伐记忆（秒）"
    description: "百分比触发：砍了一半的树干记住其切口的时长。"
  protected-region-kinds:
    label: "受保护的区域类型"
    description: "伐木不会移除任何方块的 Vystorm Core 区域类型；区域标志 timber 可覆盖此设置。"

# 通过 Vystorm Core 提供的 /customtrees：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.customtrees 下的
# "aliases" 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name"
# 和 "aliases" 在所有语言中都可使用，英文始终有效。
commands:
  customtrees:
    description: "自定义树木：树木指南、带形状的树苗、修剪、种植助手和植物图鉴"
    aliases: [自定义树木]
    sub:
      breed:
        name: "育种"
        aliases: []
        description: "杂交双手中的两株生长预设树苗"
      guide:
        name: 指南
        aliases: []
        description: "打开树木指南（网页或游戏内教程）；也可用 /customtrees web"
        args:
          page: "指南|树种|管理"
      sapling:
        name: 树苗
        aliases: []
        description: "把你手中的单个树苗变成带树冠形状和大小的树苗"
        usage: "形状 大小"
        args:
          form: 形状
          size: 大小
      prune:
        name: 修剪
        aliases: []
        description: "修剪你正看着的花园树的树冠"
      plant:
        name: 种植
        aliases: []
        description: "种植助手：方阵和树篱行（菜单、大小、hedgeN 或关）"
        args:
          size: "2x2|3x3|5x5|10x10|hedge4..hedge32|关"
      herbarium:
        name: 植物图鉴
        aliases: [图鉴]
        description: "你的植物图鉴、其他玩家的图鉴或排行榜"
        args:
          player: "玩家|排行榜"
      next:
        name: 下一步
        aliases: []
        description: "推荐尚未收集的植物形态并说明种植方法"
        args:
          plant: 植物
      status:
        name: 状态
        aliases: []
        description: "显示当前设置和功能状态"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"
    values:
      status: 状态
      guide: 指南
      species: 树种
      admin: 管理
      top: 排行榜

