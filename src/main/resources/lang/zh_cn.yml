      natural: "自然生长"
      bonemeal: "骨粉"
      glowstone: "荧石粉"
      coal: "煤炭"
      "off": "{trigger}：关闭"
    protected: "受保护的树干"
    fellable: "可砍伐"
    catalysts: "催化剂与消耗"
