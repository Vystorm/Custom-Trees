# 网页 "trees"（可选，Vystorm Core 0.24.0+）。web.ui.* 是 Vystorm 网页界面中该页面的文本。
web:
  module:
    title: "树木指南"
    description: "树苗如何长成自定义树木：阵型、树种、催化剂和消耗"
  error:
    reload-failed: "重新加载失败，仍沿用之前的设置：{error}"
    no-permission: "你没有权限执行此操作。"
    not-ready: "CustomTrees 尚未就绪。"
  ui:
    tab:
      guide: "种植方法"
      species: "树种"
      admin: "管理"
    loading: "正在加载树木指南…"
    error: "无法加载树木指南：{error}"
    intro: "在同一高度种下同种树苗。树苗组的形状决定长出哪种树——最大的完整阵型优先。"
    worlds:
      all: "在所有普通（主世界）世界中生效。"
      some: "在以下世界中生效：{worlds}"
    permission: "种植需要权限 {permission}（玩家默认拥有）。"
    priority: "检查顺序：5×5 → 3×3 → 2×2 → 树篱/灌木 → 单株树苗。"
    formations: "树苗阵型"
    formation:
      single:
        title: "单株树苗"
        text: "长成该树种的自定义树木，有四种结构变体之一。"
      square:
        title: "2×2 方阵"
        text: "四株相同树苗排成方形，长成一棵树干粗壮的中大型树。"
      shrub:
        title: "灌木"
        text: "{min}–{max} 株相连的树苗（含斜向）长成一组灌木。"
      hedge:
        title: "树篱"
        text: "{min} 株或以上相连的树苗——直线、斜线、拐角或分叉均可，最多 {max} 株——长成一道连续的树篱。"
      giant:
        title: "巨树（3×3）"
        text: "九株相同树苗排成无空隙的方形，长成一棵 3×3 树干的特大树木。"
      colossal:
        title: "巨像（5×5）"
        text: "25 株相同树苗排成无空隙的方形，长成一棵圆形树干、树冠宽阔的巨像树。"
    size:
      height: "高 {min}–{max} 格"
      radius: "树冠半径 {radius}"
    disabled: "本服务器已禁用"
    legend:
      sapling: "树苗"
      target: "在此右键或使用骨粉（阵型中任意树苗均可）"
    diagram: "阵型俯视图：{count} 株树苗"
