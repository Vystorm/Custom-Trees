# Русский — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
title: CustomTrees
permission: customtrees.grow
pages:
- title: Посадка пользовательских деревьев
  text: |
    CustomTrees заменяет рост саженцев в обычных мирах своими собственными формами деревьев. По умолчанию включен каждый NORMAL миров.

    1. Растительные саженцы такого же рода со свободным пространством над ними.
    2. Один саженец становится обычным деревом на нормальном росте или с костной мукой.
    3. Полный комплект 2×2 квадратных метров саженцев становится средним и большим деревом.
    4. Костная мука сразу запускает настроенный размер и использует ровно один предмет вне творческого режима.

    Для роста требуется customtrees.grow.
- title: Крубы и изгороди
  text: |
    Подключенные саженцы могут расти в небольшие ландшафтные формы.

    1. Соедините два или три саженца одного и того же типа на одной и той же высоте, также по диагонали, вокруг углов или разветвления.
    2. Дождитесь нормального роста клеща или используйте костную пищу на одном из этих саженцев.
    3. Группа становится кустарником.
    4. Соедините четыре или более саженцев одного и того же типа, чтобы получить непрерывную изгородь.

    Полный комплект 2×2, 3×3 и 5×5 квадратов остаются размером с дерево и не рассматриваются как изгородь.
- title: Гигантское дерево 3×3
  text: |
    Полный комплект 3×3 полей одних и тех же саженцев создают сверхбольшое дерево.

    1. Посадите девять саженцев того же типа, что и квадрат без зазора на одной высоте.
    2. Оставьте достаточно свободного пространства над всей территорией.
    3. Дождитесь естественного роста или используйте костную муку на одном из девяти саженцев.
    4. Размер по умолчанию: от 36 до 48 блоков высотой с радиусом короны 11.

    Естественный и костный рост 3×3 может быть переключено на сервер.
- title: Колосс из 5×5
  text: |
    Полный комплект 5×5 поле тех же саженцев создает колоссальное дерево с круглым стволом и широкой короной.

    1. Посадить 25 саженцев такого же рода, как беззазорный квадрат на одной высоте.
    2. Держите пространство над всей базой свободным.
    3. Дождитесь естественного роста или используйте костную муку на одном саженце поля.
    4. Размер по умолчанию: от 52 до 68 блоков высотой с радиусом короны 17.

    Оба триггера и размеры могут быть изменены в конфигурации сервера.
- title: Светящееся дерево со светящейся пылью
  text: |
    Правый щелчок саженца с пылевой пылью вырастает защищенным светящимся вариантом. Светящийся камень помещается предпочтительно в темную внутреннюю листву.

    1. Держите светящуюся пыль и щелкните правой кнопкой мыши действительный саженец.
    2. Убедитесь, что форма дерева имеет достаточно свободного пространства.
    3. В режиме выживания используется одна светящаяся пыль и 100 реальных XP точек.
    4. При установке CoreProtect стволы регистрируются как защищенные CustomTrees места размещения. Стоимость и количество света настраиваются.
- title: угольное дерево
  text: |
    С углем растет та же привычная форма дерева, но намеренно без защиты стволов CoreProtect.

    1. Держите уголь и щелкните правой кнопкой мыши действительный саженец.
    2. Удостоверьтесь, что места достаточно, и дерево сразу вырастет.
    3. В режиме выживания используется один кусок угля.
    4. Используйте этот вариант, когда багажники не должны быть зарегистрированы как защищенные CustomTrees мест размещения.
- title: Генерация естественного мира
  text: |
    Помимо деревьев, выращенных игроками, CustomTrees могут заменить сгенерированные деревья. По умолчанию шанс замены составляет 100 %.

    1. Исследуйте новые области в нормальном мире.
    2. Генерированные деревья могут быть заменены обычными формами деревьев.
    3. Короткий одноразовый проход проходит после генерации чанка, поэтому деревья, помещенные поздно (например, объекты Iris), также заменяются.
    4. Существующие чанки никогда не переписываются только потому, что они загружаются снова.
- title: 'Админ: настройки, статус и перезагрузка'
  permission: customtrees.admin
  text: |
    Менеджмент для администраторов.

    1. /customtrees status показывает активные миры, переключатели и счетчики для деревьев, гигантов, колоссов, кустарников, изгородей, а также светящихся и угольных деревьев.
    2. Переключатели и номера в меню Vystorm → сервер → CustomTrees (also /vsettings or /vadmin); Они применяются немедленно.
    3. Недействительные комбинации, такие как минимальная высота выше максимальной высоты, отклоняются и сбрасываются на предыдущие значения.
    4. Мировой отбор (enabled-worlds) только в config.yml; пробег /customtrees reload потом. Если конфигурация недействительна, ранее активные настройки остаются в силе.
- title: 10x10 мировых деревьев и гигантских грибов
  text: |
    растение 100 идентичные обычные саженцы, red/brown грибы или crimson/warped грибы в 10x10 квадратных метров на одной высоте.
    Правильно щелкните любой член с костной едой. Дерево сначала планируется и растет поэтапно после того, как его одобряют плагины защиты. Он потребляет одну костную пищу, нет XP; уголь, известняк и профильные саженцы не поддерживаются для такого размера.
    Высота по умолчанию: деревья 160 (коронный радиус 44, корни до ~30 блоки, около 110x110 блоков загруженной площади, грибы 80, Нижние грибы 48 blocks. Препятствия никогда не останавливают рост: растения, снег, листья и мягкая земля (грязь, трава, песок, гравий, глина, грязь) заменяются, корни копаются в земле и через воду, здания и другие блоки просто остаются. Отсутствующие чанки загружаются автоматически; дерево, которое слишком высокое для места, уменьшается. Голые грибы нуждаются в подборе нилиума под всеми 100 растения.
    Присядьте правой кнопкой мыши с пустой основной рукой, чтобы увидеть настроенные размеры. Полные 10x10 квадратов не растут естественным образом и не возвращаются к 5x5. A Остановка сервера может оставить частично выращенное дерево.
    Админы: настройки мировых деревьев в config.yml или /vadmin config CustomTrees. Изменения вступают в силу для новых рабочих мест.
- title: 'Грибы и черные грибы: все размеры'
  text: |
    Красные / коричневые грибы и малиновые / искривленные грибы поддерживают 1x1, 2x2, 3x3, 5x5 и 10x10 квадратов идентичных растений. Правильно щелкните костной едой. Побеждает самая крупная полная формация.
    Высота грибов: 8, 16, 28, 44 и 80 блоков. Высота плесени: 8, 14, 24, 36 и 48. Все измерения настраиваются в соответствии с World-trees.fungi 10x10 использует существующие значения мирового дерева.
    Возникают препятствия и здания сохраняются; перед потреблением проводятся мероприятия по защите. Маленькие деревья сохраняют существующее поведение.
- title: 'Посадочный помощник: целые квадраты сразу'
  text: |
    Откройте помощника в /vmenu (Building) или с /customtrees plant и выбрать 2x2, 3x3, 5x5 или 10x10.
    Затем поместите один саженец, размножитель, гриб или гриб. Он становится ближайшим к вам уголком; площадь растет вперед и справа от вас и заполняется из вашего инвентаря.
    Если пятно заблокировано или не имеет подходящего грунта, больше ничего не посажено, и пятна отмечены красным цветом. Охраняемые территории соблюдаются.
    Помощник отключается после одного квадрата (or after 5 minutes unused). /customtrees plant off Выключите его сразу.
- title: 'Гербарий: собирайте каждую форму'
  text: |
    Каждая форма дерева и гриба, которую вы выращиваете сами, записана: девять видов как одно дерево, 2x2, 3x3, 5x5, изгородь, светящееся дерево и 10x10 мировое дерево, плюс четыре гриба и грибы в пяти размерах.
    Откройте свой гербарий /vmenu (Character) или с /customtrees herbarium. Больше форм приносят более высокие ранги, от Спроута до Хранителя Иггдрасила.
    Нажмите на другого игрока, чтобы посмотреть на их гербарий. /customtrees herbarium top Показать лучшие лесники.
    /customtrees next Предлагается отсутствующая форма с инструкциями по посадке, начиная с небольших образований. Добавить растение ID Например, фильтровать вишню или щелкнуть вид в гербарии для вашей следующей задачи. Настройки роста сервера все еще применяются.
- title: 'Древесина: целые деревья с топором'
  text: |
    Нарезать бревно топором (without sneaking) И все дерево спускается. Это работает для естественных деревьев и для каждого CustomTrees деревьев.
    Дерево падает: дерево отклоняется от вас вокруг своего пня и разбивается на предметы, где оно приземляется. Прямо вниз: он ломается снизу вверх.
    В зависимости от сервера, дерево падает при первом бревне, или только один раз вырезается доля сечения ствола. Затем экшн-бар показывает, например, "Trunk 3/8".
    в /vsettings Вы можете отключить древесину для себя или выбрать, как деревья спускаются. Подкрадывайтесь, чтобы рубить бревна. Игроки строят и охраняемые территории никогда не вырубаются.
    Маленькие деревья пересаживаются самостоятельно: саженец из капель дерева (or your inventory) Туда, где стоял ствол.
